<script id="logic">
/* ==========================================================================
   PURE GAME LOGIC. No DOM, no canvas, no audio. Everything the theory claims
   lives here and is what the fight actually runs on.
   ========================================================================== */
var EL = (function () {
  'use strict';

  /* ---------- Random numbers (seedable so checks are reproducible) ---------- */
  function makeRng(seed) {
    var a = (seed >>> 0) || 1;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function gauss(rng) {
    var u = 1 - rng(), v = rng();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  }
  function sampleMix(mix, keys, rng) {
    var r = rng(), acc = 0;
    for (var i = 0; i < keys.length; i++) {
      acc += mix[keys[i]];
      if (r < acc) return keys[i];
    }
    return keys[keys.length - 1];
  }
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

  /* ---------- Techniques ---------- */
  // score: judging value of a clean technique (kicks and knees above punches)
  // dmg: damage of a clean hit; windup/recover in seconds; reach in px (centre to centre)
  var TECH = {
    punch: { name: 'Punch', score: 2, dmg: 4, cost: 4, windup: 0.11, recover: 0.17, reach: 200 },
    elbow: { name: 'Elbow', score: 3, dmg: 8, cost: 6, windup: 0.15, recover: 0.22, reach: 118 },
    teep: { name: 'Teep', score: 2.5, dmg: 3, cost: 6, windup: 0.19, recover: 0.25, reach: 292 },
    low: { name: 'Low kick', score: 3, dmg: 5, cost: 7, windup: 0.22, recover: 0.26, reach: 205 },
    body: { name: 'Body kick', score: 4, dmg: 7, cost: 9, windup: 0.27, recover: 0.30, reach: 292 },
    knee: { name: 'Knee', score: 4, dmg: 8, cost: 8, windup: 0.22, recover: 0.27, reach: 118 },
    head: { name: 'Head kick', score: 6, dmg: 12, cost: 12, windup: 0.35, recover: 0.38, reach: 292 }
  };
  var STAGGER_DMG = 7;          // clean hits at or above this make the victim visibly react
  var STAGGER_POINTS = 1;       // ...which costs the victim this much with the judges

  var RANGE = { close: 112, mid: 198, long: 288 };
  function bandOf(dist) {
    if (dist < RANGE.close) return 'close';
    if (dist < RANGE.mid) return 'mid';
    if (dist < RANGE.long) return 'long';
    return 'out';
  }

  var BANDS = ['long', 'mid', 'close', 'clinch'];
  var STRIKE_BANDS = ['long', 'mid', 'close'];
  var DEFENCES = ['guard', 'check', 'lean', 'catch', 'step'];
  var BAND_ATTACKS = {
    long: ['teep', 'body', 'head'],
    mid: ['punch', 'body', 'head', 'low'],
    close: ['elbow', 'knee'],
    clinch: ['cknee', 'pull', 'shift']
  };
  var LABEL = {
    punch: 'Punch', elbow: 'Elbow', teep: 'Teep', low: 'Low kick', body: 'Body kick', knee: 'Knee', head: 'Head kick',
    guard: 'Guard', check: 'Check', lean: 'Lean back', 'catch': 'Catch', step: 'Step back', none: 'No defence',
    cknee: 'Knee', pull: 'Pull down', shift: 'Shift weight'
  };

  /* ---------- What happens when an attack meets a defence ---------- */
  // Outcome types per range band. This single table drives both the payoff
  // matrices (and so the equilibrium) and the live fight resolution.
  var OUTCOME = {
    long: {
      teep: { guard: 'blocked', check: 'blocked', lean: 'clean', 'catch': 'caught', step: 'clean' },
      body: { guard: 'blocked', check: 'blocked', lean: 'clean', 'catch': 'caught', step: 'evaded' },
      head: { guard: 'blocked', check: 'clean', lean: 'countered', 'catch': 'clean', step: 'evaded' }
    },
    mid: {
      punch: { guard: 'blocked', check: 'clean', lean: 'countered', 'catch': 'clean', step: 'clean' },
      body: { guard: 'blocked', check: 'blocked', lean: 'clean', 'catch': 'caught', step: 'blocked' },
      head: { guard: 'blocked', check: 'clean', lean: 'countered', 'catch': 'clean', step: 'evaded' },
      low: { guard: 'clean', check: 'checked', lean: 'clean', 'catch': 'clean', step: 'blocked' }
    },
    close: {
      elbow: { guard: 'blocked', check: 'clean', lean: 'countered', 'catch': 'clean', step: 'evaded' },
      knee: { guard: 'blocked', check: 'checked', lean: 'clean', 'catch': 'clean', step: 'clean' }
    }
  };

  // Judging value (points to the attacker; negative means the defender wins the exchange)
  function cleanValue(atk) {
    var t = TECH[atk];
    return t.score + (t.dmg >= STAGGER_DMG ? STAGGER_POINTS : 0);
  }
  function typeValue(atk, type) {
    var s = TECH[atk].score;
    switch (type) {
      case 'clean': return cleanValue(atk);
      case 'blocked': return 0.4 * s;
      case 'evaded': return -0.5;
      case 'checked': return -(0.8 * s + 0.5);
      case 'caught': return -(s + 1.5);
      case 'countered': return -2.5;
      default: return -0.5; // missed or jammed
    }
  }
  function outcomeType(band, atk, def) {
    if (def === 'none') return 'clean';
    var row = OUTCOME[band] && OUTCOME[band][atk];
    return row ? row[def] : 'missed';
  }
  function outcomeValue(band, atk, def) { return typeValue(atk, outcomeType(band, atk, def)); }
  function attackValidIn(band, atk) { return !!(OUTCOME[band] && OUTCOME[band][atk]); }

  /* ---------- Clinch: a posture tug-of-war, each beat a simultaneous move ---------- */
  // Rows: your move, columns: opponent's move, value: judging points to you.
  // Knee beats shifting weight (it lands), pulling the head beats a knee
  // (you are on one leg), shifting weight beats a pull (you turn out of it).
  var CLINCH_WIN = { cknee: cleanValue('knee'), pull: 2, shift: 2 };
  var CLINCH_BEATS = { cknee: 'shift', pull: 'cknee', shift: 'pull' };
  var CLINCH_FREE = { cknee: cleanValue('knee'), pull: 2, shift: 1 }; // against an opponent who did nothing
  function clinchValue(me, opp) {
    var meNone = !me || me === 'none', oppNone = !opp || opp === 'none';
    if (meNone && oppNone) return 0;
    if (oppNone) return CLINCH_FREE[me];
    if (meNone) return -CLINCH_FREE[opp];
    if (me === opp) return 0;
    if (CLINCH_BEATS[me] === opp) return CLINCH_WIN[me];
    return -CLINCH_WIN[opp];
  }

  /* ---------- Payoff matrices ---------- */
  function buildMatrices() {
    var M = {};
    STRIKE_BANDS.forEach(function (b) {
      var rows = BAND_ATTACKS[b];
      M[b] = { rows: rows, cols: DEFENCES.slice(), A: rows.map(function (a) { return DEFENCES.map(function (d) { return outcomeValue(b, a, d); }); }) };
    });
    var cm = BAND_ATTACKS.clinch;
    M.clinch = { rows: cm, cols: cm.slice(), A: cm.map(function (a) { return cm.map(function (o) { return clinchValue(a, o); }); }) };
    return M;
  }

  // Sanity rules from the design: every attack is beaten by some defence,
  // every defence loses to some attack.
  function checkNoDominance(M) {
    var problems = [];
    BANDS.forEach(function (b) {
      var m = M[b];
      m.rows.forEach(function (r, i) {
        if (!m.A[i].some(function (v) { return v < 0; })) problems.push(b + ': ' + r + ' is never beaten');
      });
      m.cols.forEach(function (c, j) {
        if (!m.A.some(function (row) { return row[j] > 0; })) problems.push(b + ': ' + c + ' never loses');
      });
    });
    return problems;
  }

  /* ---------- Fictitious play (Brown 1951, Robinson 1951) ---------- */
  // Two imaginary players repeatedly best-respond to each other's empirical
  // mix (alternating moves, as in Brown's original scheme). In a zero-sum game
  // the empirical mixes converge to a Nash equilibrium. We iterate until the
  // duality gap (what the attacker could get by best-responding to the
  // defender's mix, minus what its own mix guarantees) is below tol.
  function fictitiousPlay(A, opts) {
    opts = opts || {};
    var tol = opts.tol || 5e-4, maxIter = opts.maxIter || 2e7, check = 500;
    var n = A.length, m = A[0].length, i, j;
    var rowCount = new Float64Array(n), colCount = new Float64Array(m);
    var rowPay = new Float64Array(n), colPay = new Float64Array(m);
    var bi = 0, bj = 0, t = 0, gap = Infinity;
    while (t < maxIter) {
      rowCount[bi]++; t++;
      for (j = 0; j < m; j++) colPay[j] += A[bi][j];
      bj = 0; for (j = 1; j < m; j++) if (colPay[j] < colPay[bj]) bj = j;
      colCount[bj]++;
      for (i = 0; i < n; i++) rowPay[i] += A[i][bj];
      bi = 0; for (i = 1; i < n; i++) if (rowPay[i] > rowPay[bi]) bi = i;
      if (t % check === 0) {
        gap = rowPay[bi] / t - colPay[bj] / t;
        if (gap < tol) break;
      }
    }
    var upper = rowPay[bi] / t, lower = colPay[bj] / t;
    gap = upper - lower;
    var rowMix = [], colMix = [];
    for (i = 0; i < n; i++) rowMix.push(rowCount[i] / t);
    for (j = 0; j < m; j++) colMix.push(colCount[j] / t);
    return { rowMix: rowMix, colMix: colMix, value: (upper + lower) / 2, gap: gap, iterations: t, converged: gap < tol };
  }

  function computeEquilibria(M, opts) {
    var eq = {};
    BANDS.forEach(function (b) {
      var r = fictitiousPlay(M[b].A, opts);
      var att = {}, def = {};
      M[b].rows.forEach(function (a, i) { att[a] = r.rowMix[i]; });
      M[b].cols.forEach(function (d, j) { def[d] = r.colMix[j]; });
      eq[b] = { attack: att, defence: def, value: r.value, gap: r.gap, iterations: r.iterations, converged: r.converged };
    });
    return eq;
  }

  function assertInterior(eq) {
    var failures = [];
    BANDS.forEach(function (b) {
      Object.keys(eq[b].attack).forEach(function (a) {
        var p = eq[b].attack[a];
        if (!(p > 0 && p < 1)) failures.push(b + '/' + a + '=' + p);
      });
    });
    return failures;
  }

  /* ---------- Best responses ---------- */
  function bestDefence(band, q) {
    var best = null, bestV = Infinity;
    DEFENCES.forEach(function (d) {
      var v = 0;
      BAND_ATTACKS[band].forEach(function (a) { v += (q[a] || 0) * outcomeValue(band, a, d); });
      if (v < bestV - 1e-9) { bestV = v; best = d; }
    });
    return best;
  }
  var DEF_SPACE = DEFENCES.concat(['none']);
  function bestAttack(band, q) {
    var best = null, bestV = -Infinity;
    BAND_ATTACKS[band].forEach(function (a) {
      var v = 0;
      DEF_SPACE.forEach(function (d) { v += (q[d] || 0) * outcomeValue(band, a, d); });
      if (v > bestV + 1e-9) { bestV = v; best = a; }
    });
    return best;
  }
  function bestClinch(q) {
    var best = null, bestV = -Infinity;
    BAND_ATTACKS.clinch.forEach(function (m) {
      var v = 0;
      BAND_ATTACKS.clinch.forEach(function (o) { v += (q[o] || 0) * clinchValue(m, o); });
      if (v > bestV + 1e-9) { bestV = v; best = m; }
    });
    return best;
  }

  /* ---------- Learning the player's habits ---------- */
  // Recency-weighted counts conditioned on (range band, previous action),
  // backed off to the band-only counts, with a uniform prior on top.
  function kindOf(action) {
    if (action === 'cknee' || action === 'pull' || action === 'shift') return 'cl';
    if (DEF_SPACE.indexOf(action) >= 0) return 'def';
    return 'atk';
  }
  function Predictor(params) {
    params = params || {};
    this.lambda = params.lambda != null ? params.lambda : 0.86;
    this.alpha = params.alpha != null ? params.alpha : 0.4;
    this.kappa = params.kappa != null ? params.kappa : 1.5;
    this.counts = {};
  }
  Predictor.prototype._bump = function (key, action) {
    var t = this.counts[key] || (this.counts[key] = {});
    var k = kindOf(action), lam = this.lambda;
    Object.keys(t).forEach(function (a) { if (kindOf(a) === k) t[a] *= lam; });
    t[action] = (t[action] || 0) + 1;
  };
  Predictor.prototype.observe = function (band, prev, action) {
    if (BANDS.indexOf(band) < 0 || !action) return;
    this._bump(band + '|*', action);
    this._bump(band + '|' + prev, action);
  };
  Predictor.prototype.predict = function (band, prev, set) {
    var B = this.counts[band + '|*'] || {}, C = this.counts[band + '|' + prev] || {};
    var wb = 0, wc = 0, n = set.length, a, i, out = {};
    for (i = 0; i < n; i++) { a = set[i]; wb += B[a] || 0; wc += C[a] || 0; }
    for (i = 0; i < n; i++) {
      a = set[i];
      var pb = ((B[a] || 0) + this.alpha) / (wb + this.alpha * n);
      out[a] = ((C[a] || 0) + this.kappa * pb) / (wc + this.kappa);
    }
    return out;
  };
  function argmaxKey(q, set) {
    var best = set[0];
    for (var i = 1; i < set.length; i++) if (q[set[i]] > q[best]) best = set[i];
    return best;
  }
  // 0 when the prediction is uniform, 1 when it is certain
  function confidence(q, set) {
    var n = set.length, mx = q[argmaxKey(q, set)];
    return clamp((mx - 1 / n) / (1 - 1 / n), 0, 1);
  }

  /* ---------- Opponent styles ---------- */
  // Ladder, easiest first. learn: the per-opponent learning factor.
  // strength: how far the style mix leans away from the equilibrium mix.
  var OPPONENTS = [
    { id: 'dejrit', name: 'Dejrit Kor Sangthong', nick: 'The Hammer', gym: 'Kor Sangthong Gym', style: 'Heavy puncher',
      line: 'Walks you down behind a high guard and swings heavy hands and elbows.',
      learn: 0.8, strength: 0.45, aggression: 0.85, prefer: 'mid', clinch: 0.08, skin: 0.5,
      attackFav: { punch: 5, elbow: 3, low: 1.5, body: 0.8, head: 0.4, teep: 0.5, knee: 1, cknee: 1, pull: 1, shift: 1 },
      defenceFav: { guard: 4, check: 1, lean: 0.4, 'catch': 0.4, step: 1 } },
    { id: 'lamnam', name: 'Lamnam Sit Nonglek', nick: 'The Whip', gym: 'Sit Nonglek Gym', style: 'Kicker',
      line: 'Long and loose, fires body and head kicks from range and checks everything.',
      learn: 0.82, strength: 0.4, aggression: 0.9, prefer: 'long', clinch: 0.05, skin: 0.65,
      attackFav: { punch: 0.6, elbow: 0.6, low: 2.5, body: 3.5, head: 3, teep: 2.5, knee: 1, cknee: 1, pull: 1, shift: 1 },
      defenceFav: { guard: 1, check: 3, lean: 1.5, 'catch': 0.6, step: 2 } },
    { id: 'kraisorn', name: 'Kraisorn Por Wanchai', nick: 'Iron Collar', gym: 'Por Wanchai Camp', style: 'Knee and clinch specialist',
      line: 'Grabs the neck at every chance and drowns you in knees.',
      learn: 0.85, strength: 0.45, aggression: 0.95, prefer: 'close', clinch: 0.45, skin: 0.4,
      attackFav: { punch: 0.8, elbow: 1, low: 0.8, body: 1, head: 0.4, teep: 2, knee: 5, cknee: 3, pull: 2, shift: 1 },
      defenceFav: { guard: 2, check: 2.5, lean: 0.6, 'catch': 1.5, step: 0.5 } },
    { id: 'wanchalerm', name: 'Wanchalerm Petchsamut', nick: 'The Razor', gym: 'Petchsamut Gym', style: 'Elbow specialist',
      line: 'Slips inside your kicks to cut you with elbows from every angle.',
      learn: 0.88, strength: 0.4, aggression: 1.0, prefer: 'close', clinch: 0.15, skin: 0.55,
      attackFav: { punch: 2, elbow: 6, low: 1, body: 0.8, head: 0.5, teep: 0.6, knee: 1.5, cknee: 1, pull: 1.5, shift: 1 },
      defenceFav: { guard: 2, check: 1, lean: 2.5, 'catch': 1, step: 1 } },
    { id: 'nattapong', name: 'Nattapong Sitchanthep', nick: 'The Mirror', gym: 'Sitchanthep Gym', style: 'Technical counter-striker',
      line: 'Patient and slippery. Leans, catches and makes you pay for every miss.',
      learn: 0.92, strength: 0.35, aggression: 0.95, prefer: 'mid', clinch: 0.08, skin: 0.6,
      attackFav: { punch: 1.5, elbow: 1, low: 2, body: 1, head: 1, teep: 2.5, knee: 1, cknee: 1, pull: 1, shift: 1.5 },
      defenceFav: { guard: 0.6, check: 1.5, lean: 3, 'catch': 3, step: 1 } },
    { id: 'thanakorn', name: 'Thanakorn Lukmaenam', nick: 'The Professor', gym: 'Lukmaenam Gym', style: 'Champion',
      line: 'No favourite weapon and no habits. Learns your patterns faster than anyone.',
      learn: 1.0, strength: 0, aggression: 1.1, prefer: 'mid', clinch: 0.15, skin: 0.45,
      attackFav: {}, defenceFav: {} }
  ];
  var DIVISION_EXTRA = [
    { id: 'boonlert', name: 'Boonlert Sor Rattanachai', gym: 'Sor Rattanachai Gym' },
    { id: 'chatri', name: 'Chatri Kiatnakorn', gym: 'Kiatnakorn Gym' },
    { id: 'ekachai', name: 'Ekachai Wor Saengtong', gym: 'Wor Saengtong Camp' },
    { id: 'kittisak', name: 'Kittisak Sor Phanthong', gym: 'Sor Phanthong Gym' },
    { id: 'surasak', name: 'Surasak Lukthapra', gym: 'Lukthapra Gym' },
    { id: 'yodchai', name: 'Yodchai Kiatsuwan', gym: 'Kiatsuwan Gym' }
  ];
  function newDivision(rng) {
    var fighters = OPPONENTS.map(function (o) { return { id: o.id, name: o.name, gym: o.gym }; })
      .concat(DIVISION_EXTRA.map(function (o) { return { id: o.id, name: o.name, gym: o.gym }; }));
    fighters.forEach(function (f) { f.cut = 0.005 + rng() * 0.035; f.skill = 1 + 0.05 * gauss(rng); f.wins = 0; f.losses = 0; });
    var div = { fighters: fighters, history: [] };
    div.history.push(divisionAverage(div));
    return div;
  }

  function styleMixes(eq, style) {
    // A style is the equilibrium mix tilted towards the fighter's favourite tools.
    var s = style.strength, out = { attack: {}, defence: {} };
    BANDS.forEach(function (b) {
      var acts = BAND_ATTACKS[b];
      var fav = {}, tot = 0;
      acts.forEach(function (a) { fav[a] = (style.attackFav[a] != null ? style.attackFav[a] : 1); tot += fav[a]; });
      var mix = {};
      acts.forEach(function (a) { mix[a] = (1 - s) * eq[b].attack[a] + s * fav[a] / tot; });
      out.attack[b] = mix;
      if (b !== 'clinch') {
        var dfav = {}, dt = 0, dm = {};
        DEFENCES.forEach(function (d) { dfav[d] = (style.defenceFav[d] != null ? style.defenceFav[d] : 1); dt += dfav[d]; });
        DEFENCES.forEach(function (d) { dm[d] = (1 - s) * eq[b].defence[d] + s * dfav[d] / dt; });
        out.defence[b] = dm;
      }
    });
    return out;
  }

  // One AI decision. kind: 'defend' (player is attacking), 'attack' or 'clinch'.
  // With probability confidence x learning factor the AI best-responds to its
  // prediction of the player's move; otherwise it plays its own style's mix.
  function decide(kind, predictor, band, prev, mixes, learnFactor, rng) {
    var set, br, styleMix, styleKeys;
    if (kind === 'defend') { set = BAND_ATTACKS[band]; styleMix = mixes.defence[band]; styleKeys = DEFENCES; }
    else if (kind === 'attack') { set = DEF_SPACE; styleMix = mixes.attack[band]; styleKeys = BAND_ATTACKS[band]; }
    else { set = BAND_ATTACKS.clinch; styleMix = mixes.attack.clinch; styleKeys = BAND_ATTACKS.clinch; band = 'clinch'; }
    var q = predictor.predict(band, prev, set);
    var conf = confidence(q, set);
    var predicted = argmaxKey(q, set);
    var pRead = conf * learnFactor;
    var action, mode;
    if (rng() < pRead) {
      action = kind === 'defend' ? bestDefence(band, q) : kind === 'attack' ? bestAttack(band, q) : bestClinch(q);
      mode = 'read';
    } else {
      action = sampleMix(styleMix, styleKeys, rng);
      mode = 'style';
    }
    return { action: action, mode: mode, predicted: predicted, confidence: conf, pRead: pRead, q: q };
  }

  /* ---------- Weight cut ---------- */
  var CUT_MAX = 0.10;
  var CUT = { power: 0.8, reach: 30, cap: 0.25, recovery: 0.35 };
  function cutModifiers(cutSelf, cutOpp) {
    var adv = Math.max(0, cutSelf - cutOpp) / CUT_MAX;   // size edge on fight night, for whoever cut more
    var q = (cutSelf / CUT_MAX) * (cutSelf / CUT_MAX);   // own cost grows with the square of the cut
    return {
      power: 1 + CUT.power * adv,
      reach: CUT.reach * adv,
      staminaCap: 1 - CUT.cap * q,
      recovery: 1 - CUT.recovery * q
    };
  }

  // Off-screen bout using the same matrices, equilibrium mixes and cut model.
  // One tick is one second of a 5 x 45 s fight.
  var SIM = { attackRate: 0.5, fatigueAttack: 0.2, fail: 1.0, dmg: 0.13, regen: 9, betweenRounds: 40 };
  // A tired fighter cannot brace: incoming damage grows as stamina falls (used in the live fight too)
  var ABSORB = { k: 0.6 };
  function absorbFactor(stamina) { var tired = clamp(1 - stamina / 100, 0, 1); return 1 + ABSORB.k * tired; }
  var SIM_BANDS = { long: 0.3, mid: 0.4, close: 0.18, clinch: 0.12 };
  function simulateBout(A, B, eq, rng) {
    var mA = cutModifiers(A.cut, B.cut), mB = cutModifiers(B.cut, A.cut);
    function mk(f, m) {
      return { hp: 100, cap: 100 * m.staminaCap, st: 100 * m.staminaCap, rec: m.recovery, pow: m.power * (f.skill || 1), reach: m.reach, pts: 0, taken: 0 };
    }
    var F = [mk(A, mA), mk(B, mB)];
    var cards = [0, 0], ko = -1, round = 0;
    for (round = 0; round < 5 && ko < 0; round++) {
      F[0].pts = F[1].pts = 0;
      for (var tick = 0; tick < 45 && ko < 0; tick++) {
        var first = rng() < 0.5 ? 0 : 1;
        for (var o = 0; o < 2 && ko < 0; o++) {
          var k = o === 0 ? first : 1 - first, a = F[k], d = F[1 - k];
          var fresh = a.st / 100;
          if (a.st > 4 && rng() < SIM.attackRate * (1 - SIM.fatigueAttack * (1 - fresh))) {
            var r = rng(), band = 'long', acc = 0;

  function drawAccuracy(x, y, w, h, series) {
    ctx.strokeStyle = 'rgba(255,255,255,0.1)'; ctx.lineWidth = 1; ctx.font = font(11, false); ctx.fillStyle = COL.faint; ctx.textAlign = 'right';
    [0, 0.5, 1].forEach(function (v) { var yy = y + h - h * v; ctx.beginPath(); ctx.moveTo(x, yy); ctx.lineTo(x + w, yy); ctx.stroke(); ctx.fillText(Math.round(v * 100) + '%', x - 4, yy + 4); });
    ctx.textAlign = 'left'; ctx.fillText('First exchange', x, y + h + 16); ctx.textAlign = 'right'; ctx.fillText('Last exchange', x + w, y + h + 16);
    if (!series || series.length < 2) return;
    ctx.strokeStyle = COL.cyan; ctx.lineWidth = 2; ctx.beginPath();
    series.forEach(function (v, i) { var xx = x + w * i / (series.length - 1), yy = y + h - h * v; if (i) ctx.lineTo(xx, yy); else ctx.moveTo(xx, yy); });
    ctx.stroke();
  }
  function drawCutBars(x, y, pc, oc, oname) {
    [[pc, 'You', COL.blue], [oc, oname, COL.red]].forEach(function (r, i) {
      var yy = y + i * 30;
      ctx.font = font(13, false); ctx.fillStyle = COL.dim; ctx.textAlign = 'left'; ctx.fillText(r[1], x, yy + 12);
      ctx.fillStyle = '#2a2420'; ctx.fillRect(x + 210, yy, 400, 14);
      ctx.fillStyle = r[2]; ctx.fillRect(x + 210, yy, 400 * r[0] / EL.CUT_MAX, 14);
      ctx.fillStyle = COL.text; ctx.fillText(pct(r[0]), x + 620, yy + 12);
    });
  }

  /* ---------- Career summary ---------- */
  var careerScreen = {
    state: { focus: 0 }, buttons: [],
    enter: function () {
      this.buttons = [Button('Download data', 60, 650, 240, 48, downloadData, true), Button('Title', 1060, 650, 160, 48, function () { setScreen(titleScreen); })];
      this.state.focus = 0;
    },
    update: function (dt, presses) { if (presses.indexOf('Escape') >= 0) { setScreen(titleScreen); return; } menuKeys(presses, this.buttons, this.state); },
    onDown: function (x, y) { this.buttons.forEach(function (b) { if (inside(b, x, y)) b.action(); }); },
    render: function (t) {
      menuBackdrop(t, 0.84, false);
      ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';
      heading('Career summary', 60, 50, 18);
      var R = career.record;
      ctx.font = font(26, 2); ctx.fillStyle = career.complete ? COL.gold : COL.text;
      ctx.fillText(career.complete ? 'Champion.  Record ' + R.wins + '-' + R.losses + ', ' + R.kos + ' by knockout' : 'Record ' + R.wins + '-' + R.losses, 60, 88);
      var fs = career.fights;
      var avg = function (key) { var v = fs.map(function (f) { return f.analysis[key]; }).filter(function (x) { return x != null; }); return v.length ? v.reduce(function (a, b) { return a + b; }, 0) / v.length : null; };
      var avgPred = avg('predictability'), avgAcc = avg('predictionAccuracy');
      var avgCut = fs.length ? fs.reduce(function (a, f) { return a + f.playerCut; }, 0) / fs.length : 0;
      var reads = fs.reduce(function (a, f) { return a + (f.analysis.reads || 0); }, 0);
      panel(40, 108, 560, 150);
      ctx.font = font(15, false); ctx.fillStyle = COL.dim;
      [['Fights', String(fs.length)], ['Average predictability score', avgPred == null ? '-' : avgPred.toFixed(0) + ' / 100'],
        ['Average prediction accuracy against you', avgAcc == null ? '-' : pct(avgAcc, 0)], ['Total reads against you', String(reads)], ['Your average weight cut', pct(avgCut)]]
        .forEach(function (r, i) { ctx.fillStyle = COL.dim; ctx.fillText(r[0], 64, 140 + i * 25); ctx.fillStyle = COL.text; ctx.fillText(r[1], 430, 140 + i * 25); });
      drawTrend(660, 146, 520, 100, career.division.history, 'Division average cut over your career');
      panel(40, 276, 1200, 360);
      heading('Fight log', 60, 304, 13);
      var cols = [60, 330, 450, 610, 720, 830, 960, 1090];
      ['Opponent', 'Result', 'Method', 'Your cut', 'Their cut', 'Predictability', 'AI accuracy', 'Reads'].forEach(function (h, i) { ctx.font = font(12, true); ctx.fillStyle = COL.faint; ctx.fillText(h.toUpperCase(), cols[i], 330); });
      fs.slice(-11).forEach(function (f, i) {
        var y = 356 + i * 25;
        ctx.font = font(14, false);
        var cells = [f.opponentName, f.result === 'win' ? 'Win' : 'Loss', f.method === 'KO' ? 'KO round ' + f.endRound : 'Decision', pct(f.playerCut), pct(f.opponentCut),
          f.analysis.predictability == null ? '-' : String(f.analysis.predictability), f.analysis.predictionAccuracy == null ? '-' : pct(f.analysis.predictionAccuracy, 0), String(f.analysis.reads || 0)];
        cells.forEach(function (c, j) { ctx.fillStyle = j === 1 ? (f.result === 'win' ? COL.gold : '#ff8a7e') : COL.text; ctx.fillText(c, cols[j], y); });
      });
      var s = this; this.buttons.forEach(function (b, i) { drawButton(b, s.state.focus === i); });
    }
  };

  /* ---------- Data export ---------- */
  function downloadData() {
    try {
      var eqOut = {};
      EL.BANDS.forEach(function (b) { eqOut[b] = { attackMix: EQ[b].attack, defenceMix: EQ[b].defence, value: EQ[b].value, dualityGap: EQ[b].gap, iterations: EQ[b].iterations }; });
      var data = {
        game: 'Eight Limbs', exportedAt: new Date().toISOString(),
        equilibrium: eqOut, payoffMatrices: MATRICES,
        opponents: EL.OPPONENTS.map(function (o) { return { id: o.id, name: o.name, gym: o.gym, style: o.style, learningFactor: o.learn, styleStrength: o.strength }; }),
        weightCutModel: { cut: EL.CUT, absorb: EL.ABSORB, payoff: EL.PAYOFF },
        career: career
      };
      var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var link = document.createElement('a');
      link.href = url; link.download = 'eight-limbs-data-' + new Date().toISOString().slice(0, 10) + '.json';
      document.body.appendChild(link); link.click();
      setTimeout(function () { URL.revokeObjectURL(url); if (link.parentNode) link.parentNode.removeChild(link); }, 1000);
    } catch (e) { console.warn('Export failed', e); }
  }

  /* ---------- Screens and main loop ---------- */
  var screen = null;
  function setScreen(s) { screen = s; if (s.enter) s.enter(); }

  var last = 0, acc = 0, realT = 0;
  function frame(now) {
    var dtMs = last ? Math.min(100, now - last) : 16;
    last = now;
    var dt = dtMs / 1000;
    realT += dt;
    if (slowMo > 0) { slowMo -= dt; timeScale = 0.25; } else timeScale = 1;
    var steps = 0;
    if (hitStop > 0) hitStop -= dt;
    else {
      acc += dt * timeScale;
      steps = Math.floor(acc / STEP);
      if (steps > 12) { steps = 12; acc = 0; }
      acc -= steps * STEP;
    }
    if (window.EightLimbs.freeze) steps = 0;
    var presses = pressedQ.splice(0);
    if (screen === fightScreen && steps === 0) {
      // keep fight inputs until the simulation can consume them, but menus never stall
      var keep = presses.filter(function (c) { return c !== 'Escape'; });
      if (presses.indexOf('Escape') >= 0 && F && !F.paused) F.paused = true;
      else if (presses.indexOf('Escape') >= 0 && F) F.paused = false;
      pressedQ = keep.concat(pressedQ);
      presses = [];
    }
    try {
      if (screen === fightScreen) {
        for (var i = 0; i < steps; i++) { if (screen !== fightScreen) break; screen.update(STEP, i === 0 ? presses : []); }
      } else if (screen && screen.update) screen.update(dt, presses);
      cam.shake = Math.max(0, cam.shake - dt * 40) * Math.exp(-dt * 6);
      Sound.update(dt);
      baseTransform();
      if (screen) screen.render(realT);
    } catch (err) {
      console.error(err);
    }
    requestAnimationFrame(frame);
  }

  // test hooks for automated checks (no gameplay effect)
  window.EightLimbs = {
    EQ: EQ, MATRICES: MATRICES,
    get fight() { return F; }, get career() { return career; }, get screen() { return screen; },
    screens: { title: titleScreen, ladder: ladderScreen, weigh: weighScreen, fight: fightScreen, analysis: analysisScreen, career: careerScreen },
    startFight: function (i, pc, oc) { if (!career) { career = newCareer(); } startFight(i, pc, oc); },
    step: function (n, presses) { for (var i = 0; i < n; i++) { if (screen !== fightScreen) return; fightUpdate(STEP, i === 0 ? (presses || []) : []); } },
    hold: function (code, down) { keys[code] = !!down; },
    forceAttack: function (f, type, d) { f.state = 'free'; return startAttack(f, type, d || { action: type, mode: 'style', predicted: null, confidence: 0 }); },
    forceClinch: function () { tryClinch(F.p, F.a); },
    press: function (code) { pressedQ.push(code); }
  };

  setScreen(titleScreen);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
